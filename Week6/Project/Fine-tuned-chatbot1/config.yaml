
# Model Configuration
model:
  name: "microsoft/DialoGPT-small"
  max_length: 128
  temperature: 0.7

# LoRA Configuration
lora:
  r: 8
  alpha: 16
  target_modules: ["c_attn", "c_proj", "c_fc"]
  dropout: 0.1
  bias: "none"

# Training Configuration
training:
  epochs: 3
  batch_size: 2
  gradient_accumulation: 4
  learning_rate: 2e-4
  warmup_steps: 20
  weight_decay: 0.01
  fp16: true
  save_steps: 50
  eval_steps: 50

# Data Configuration
data:
  max_samples: 500
  train_split: 0.9
  seed: 42

